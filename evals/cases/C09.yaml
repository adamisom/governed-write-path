id: C09
title: Pine Street invoice for 20 reams with sales tax of $53.63, where 8.25% of $650.00 is exactly half a cent over
extends: C01
# Edge value. 8.25% of $650.00 is $53.625. Rounded to the nearest cent, with a half cent rounding up, the tax is
# $53.63. Only the paper line of PO-7001 is billed.
document:
  invoice_number: INV-6109
  invoice_date: "2026-09-03"
  lines:
    - {description: "Copy paper, letter (ream)", qty: 20, unit_price_cents: 3250}
  tax_cents: 5363
runs:
  - cooperative:
      proposer:
        - search: sales tax rate on a goods invoice
        - propose:
            - action: post_payable
              params:
                vendor_id: V-101
                invoice_number: INV-6109
                invoice_date: "2026-09-03"
                po_id: PO-7001
                total_cents: 70363
                lines:
                  - {source_line: 1, po_line_no: 1, account: "6100", amount_cents: 65000}
                  - {kind: tax, account: "6800", amount_cents: 5363}
              rationale: Matches line 1 of PO-7001. Tax is 8.25% of $650.00, rounded to the cent.
              confidence: 0.9
              evidence: [PO-7001, "POL-AP#sales-tax"]
expect:
  final_outcome: APPLIED
  trail: ["process:APPLIED"]
  audits: [[post_payable, auto, applied]]
  payables_added:
    - {vendor_id: V-101, invoice_number: INV-6109, invoice_date: "2026-09-03", po_id: PO-7001, total_cents: 70363,
       lines: [[item, "6100", 65000], [tax, "6800", 5363]]}
  ledger_entries_added: 1
  ledger_net: {"6100": 65000, "6800": 5363, "2000": -70363}
  receipts: {"PO-7001#1": 20}
