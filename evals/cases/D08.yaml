id: D08
title: The C01 invoice posts and is reverted, then a rescan of it arrives
extends: C01
# The written duplicate rule: an invoice number already posted for the same vendor is a duplicate and is not posted
# again. INV-6001 was posted, even though that posting was reversed, so the rescan goes to a person, who can decide
# whether it should post again.
documents:
  rescan: {layout: modern}
steps: [upload, process, revert, {upload: rescan}, process]
runs:
  - cooperative:
      proposer:
        - propose:
            - action: post_payable
              params:
                vendor_id: V-101
                invoice_number: INV-6001
                invoice_date: "2026-08-03"
                po_id: PO-7001
                total_cents: 84250
                lines:
                  - {source_line: 1, po_line_no: 1, account: "6100", amount_cents: 65000}
                  - {source_line: 2, po_line_no: 2, account: "6100", amount_cents: 19250}
              rationale: Matches PO-7001.
              confidence: 0.95
  - cooperative:
      proposer:
        - propose:
            - action: post_payable
              params:
                vendor_id: V-101
                invoice_number: INV-6001
                invoice_date: "2026-08-03"
                po_id: PO-7001
                total_cents: 84250
                lines:
                  - {source_line: 1, po_line_no: 1, account: "6100", amount_cents: 65000}
                  - {source_line: 2, po_line_no: 2, account: "6100", amount_cents: 19250}
              rationale: Matches PO-7001. A reversed payable has the same number. Code checks for duplicates.
              confidence: 0.8
expect:
  final_outcome: ROUTED_TO_HUMAN
  trail: ["process:APPLIED", "revert:REVERTED", "process:ROUTED_TO_HUMAN"]
  reason: duplicate_invoice
  audits: [[post_payable, auto, reverted], [post_payable, human, routed]]
  payables_added:
    - {vendor_id: V-101, invoice_number: INV-6001, invoice_date: "2026-08-03", po_id: PO-7001, total_cents: 84250,
       status: reversed, lines: [[item, "6100", 65000], [item, "6100", 19250]]}
  ledger_entries_added: 2
  ledger_net: {"6100": 0, "2000": 0}
