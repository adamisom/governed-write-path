id: D12
title: The A01 approval crashes after its write commits, and the approver retries the approval
extends: A01
offline_only: true
# The worker dies after the approved write commits and before the run is updated. The retry loses the compare-and-set
# and says already_decided, and it also recomputes the run's outcome from its audit records (DECISIONS 45), so the run
# says APPLIED. One payable, one ledger entry.
steps: [upload, process, {approve: {decision: approve, crash_after_commit: true}}, {approve: approve}]
expect:
  final_outcome: APPLIED
  trail: ["process:PENDING_APPROVAL", "approve:CRASHED", "approve:already_decided"]
  audits: [[post_payable, approval, applied]]
  payables_added:
    - {vendor_id: V-102, invoice_number: KOF-2201, invoice_date: "2026-08-10", po_id: PO-7004, total_cents: 390000,
       lines: [[item, "1500", 390000]]}
  ledger_entries_added: 1
  ledger_net: {"1500": 390000, "2000": -390000}
  receipts: {"PO-7004#1": 3}
