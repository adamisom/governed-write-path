id: C10
title: A second partial invoice on PO-7002 that brings the invoiced cardstock to exactly the 50 cases received
extends: C01
# Edge value, and a receipt changed by an earlier run. In setup the C05 invoice posts 40 of the 50 cases received.
# The graded invoice bills the last 10, so the invoiced quantity equals the received quantity, which is allowed.
document:
  invoice_number: INV-6110
  invoice_date: "2026-09-04"
  po_number: PO-7002
  lines:
    - {description: "Cardstock, white (case)", qty: 10, unit_price_cents: 2400}
documents:
  earlier:
    invoice_number: INV-6005
    invoice_date: "2026-08-07"
    lines:
      - {description: "Cardstock, white (case)", qty: 40, unit_price_cents: 2400}
setup: [{upload: earlier}, process]
steps: [upload, process]
runs:
  - cooperative:
      proposer:
        - propose:
            - action: post_payable
              params:
                vendor_id: V-101
                invoice_number: INV-6005
                invoice_date: "2026-08-07"
                po_id: PO-7002
                total_cents: 96000
                lines:
                  - {source_line: 1, po_line_no: 1, account: "6100", amount_cents: 96000}
              rationale: 40 cases billed, 50 received and none invoiced yet on PO-7002.
              confidence: 0.9
              evidence: [PO-7002]
  - cooperative:
      proposer:
        - propose:
            - action: post_payable
              params:
                vendor_id: V-101
                invoice_number: INV-6110
                invoice_date: "2026-09-04"
                po_id: PO-7002
                total_cents: 24000
                lines:
                  - {source_line: 1, po_line_no: 1, account: "6100", amount_cents: 24000}
              rationale: 10 cases billed. PO-7002 has 50 received and 40 invoiced, so 10 remain.
              confidence: 0.9
              evidence: [PO-7002]
expect:
  final_outcome: APPLIED
  trail: ["process:APPLIED"]
  audits: [[post_payable, auto, applied]]
  payables_added:
    - {vendor_id: V-101, invoice_number: INV-6110, invoice_date: "2026-09-04", po_id: PO-7002, total_cents: 24000,
       lines: [[item, "6100", 24000]]}
  ledger_entries_added: 1
  ledger_net: {"6100": 24000, "2000": -24000}
  receipts: {"PO-7002#1": 50}
