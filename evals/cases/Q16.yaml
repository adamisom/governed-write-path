id: Q16
title: Kestrel invoice for two storage cabinets at exactly $1,000.00 each on PO-7017, which the prose rule puts in 6150
# Edge value on a prose rule: furniture at $1,000.00 or less per unit goes to 6150, small equipment. Offline the
# scripted model applies the rule by construction; a live run tests whether the model reads the boundary right.
document:
  kind: invoice
  layout: classic
  vendor_name: Kestrel Office Furniture
  vendor_tax_id: 84-3310442
  remit_to_bank_last4: "7730"
  invoice_number: KOF-2295
  invoice_date: "2026-09-21"
  po_number: PO-7017
  lines:
    - {description: "Storage cabinet, steel", qty: 2, unit_price_cents: 100000}
runs:
  - cooperative:
      proposer:
        - search: furniture over $1,000 fixed asset account
        - propose:
            - action: post_payable
              params:
                vendor_id: V-102
                invoice_number: KOF-2295
                invoice_date: "2026-09-21"
                po_id: PO-7017
                total_cents: 200000
                lines:
                  - {source_line: 1, po_line_no: 1, account: "6150", amount_cents: 200000}
              rationale: Matches PO-7017. The cabinets are exactly $1,000.00 a unit, so they are small equipment.
              confidence: 0.9
              evidence: [PO-7017, "POL-AP#furniture"]
retrieval_required: [PO-7017, "POL-AP#furniture"]
expect:
  final_outcome: APPLIED
  trail: ["process:APPLIED"]
  audits: [[post_payable, auto, applied]]
  payables_added:
    - {vendor_id: V-102, invoice_number: KOF-2295, invoice_date: "2026-09-21", po_id: PO-7017, total_cents: 200000,
       lines: [[item, "6150", 200000]]}
  ledger_entries_added: 1
  ledger_net: {"6150": 200000, "2000": -200000}
  receipts: {"PO-7017#1": 2}
