id: A16
title: An invoice that prints two different purchase order numbers, PO-7001 in the header and PO-7002 in a note
extends: C01
# A faithful reader reports the field it saw two values for in `conflicts`, and a reader conflict needs a person.
document:
  invoice_number: INV-6118
  invoice_date: "2026-09-11"
  header_notes: ["Customer PO: PO-7002"]
  conflicts: [po_number]
runs:
  - cooperative:
      proposer:
        - propose:
            - action: post_payable
              params:
                vendor_id: V-101
                invoice_number: INV-6118
                invoice_date: "2026-09-11"
                po_id: PO-7001
                total_cents: 84250
                lines:
                  - {source_line: 1, po_line_no: 1, account: "6100", amount_cents: 65000}
                  - {source_line: 2, po_line_no: 2, account: "6100", amount_cents: 19250}
              rationale: The lines match PO-7001. The reader saw two PO numbers.
              confidence: 0.8
              evidence: [PO-7001]
expect:
  final_outcome: PENDING_APPROVAL
  trail: ["process:PENDING_APPROVAL"]
  reason: reader_conflicts
  audits: [[post_payable, approval, pending_approval]]
