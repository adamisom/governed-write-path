id: R05
title: A scripted recode of a posted Kestrel line to another allowed account, then the recode is reverted
offline_only: true
# P-9 is a Kestrel invoice for four $210.00 filing cabinets that was coded to 1500, fixed assets. The written
# furniture rule puts units at $1,000.00 or less in 6150. Both accounts are allowed for Kestrel, so a recode
# between them is auto-tier (spec section 3). A live model can't be made to propose a recode on demand.
overrides:
  payables:
    - {tenant_id: T1, payable_id: P-9, vendor_id: V-102, invoice_number: KOF-2210, invoice_date: "2026-08-05",
       po_id: PO-7009, status: open, total_cents: 84000, entry_id: E-9, created_by_write_id: W-9,
       lines: [{line_no: 1, kind: item, account: "1500", amount_cents: 84000, po_line_no: 1, qty: 4,
                description_untrusted: "Filing cabinet, 4 drawer"}]}
  ledger:
    - {tenant_id: T1, entry_id: E-9, payable_id: P-9, write_id: W-9,
       lines: [{account: "1500", debit_cents: 84000, credit_cents: 0}, {account: "2000", debit_cents: 0, credit_cents: 84000}]}
  receipts: {"PO-7009#1": {qty_invoiced: 4}}
document:
  kind: letter
  layout: classic
  vendor_name: Kestrel Office Furniture
  vendor_tax_id: 84-3310442
  letter_date: "2026-08-20"
  body:
    - "Dear accounts payable team,"
    - "Re: invoice KOF-2210. The four filing cabinets on this invoice are standard 4 drawer units at $210.00 each."
    - "Thank you, Billing, Kestrel Office Furniture"
steps: [upload, process, revert]
runs:
  - cooperative:
      proposer:
        - search: coding furniture filing cabinets
        - propose:
            - action: recode_line
              params: {payable_id: P-9, line_no: 1, account: "6150"}
              rationale: Filing cabinets at $210.00 a unit go to 6150 under the furniture rule. P-9 line 1 is in 1500.
              confidence: 0.9
              evidence: [P-9, POL-AP#furniture]
expect:
  final_outcome: APPLIED
  trail: ["process:APPLIED", "revert:REVERTED"]
  audits: [[recode_line, auto, reverted]]
  ledger_entries_added: 2
  ledger_net: {"1500": 0, "6150": 0}
